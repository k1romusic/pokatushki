  <!-- ===== HUD-кнопки ===== -->
  <div id="hud" class="hidden"><button id="btnPause" title="Пауза">⏸</button></div>
  <button id="btnMute" title="Звук">🔊</button>
  <div id="pause" class="overlay hidden"><div class="pcard">ПАУЗА<small>нажми Esc или тапни</small></div></div>

  <!-- ===== ремонт ===== -->
  <div id="repair" class="overlay hidden" data-mode="seq">
    <div class="rcard">
      <div id="rTitle" class="rtitle"></div>
      <div id="rHint" class="rhint"></div>
      <div id="rCrew" class="rcrew"></div>
      <div id="rSeq" class="rseq"></div>
      <div class="rtimer"><i id="rBar"></i></div>
      <div id="rPad" class="rpad">
        <button data-k="left">⬅</button><button data-k="up">⬆</button><button data-k="down">⬇</button><button data-k="right">➡</button>
      </div>
      <button id="rMash" class="spin-btn">ЖМИ! (пробел)</button>
      <button id="rCancel" class="rcancel">Не буду чинить (Esc)</button>
    </div>
  </div>

  <!-- ===== итоги ===== -->
  <div id="results" class="overlay hidden">
    <div class="rescard">
      <div id="resTitle" class="mk sm"></div>
      <div id="resScore" class="ressc"></div>
      <div class="resl">очков</div>
      <div id="resRank" class="resrank"></div>
      <div id="resStats" class="resstats"></div>
      <div id="resRec"></div>
      <div id="resBoss" class="resboss"></div>
      <button id="btnAgain" class="spin-btn">ЕЩЁ РЕЙС</button>
    </div>
  </div>
</div>

<!-- ===== кнопки для телефона ===== -->
<div id="touch">
  <div class="tl"><button data-key="left">◀</button><button data-key="right">▶</button></div>
  <div class="tr"><button data-key="repair" id="touchRepair" class="hidden">🔧</button><button data-key="bugor" id="touchBugor" class="hidden">🔥</button><button data-key="honk">📯</button><button data-key="jump">⤒</button></div>
</div>
<div id="rotate">Поверни телефон 📱↻</div>
